[shell]
font_family = "IBM Plex Sans KR"
polkit_agent = true
setup_wizard_enabled = false

    [shell.greeter_sync]
    auto_sync = true

    [[shell.session.actions]]
    action = "lock"

    [[shell.session.actions]]
    action = "reboot"

    [[shell.session.actions]]
    action = "shutdown"
    variant = "destructive"

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 400.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 405.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1000.0

[lockscreen]
wallpaper = "/home/maka/Pictures/wallpaper/black.png"

[wallpaper]
directory = "/home/maka/Pictures/wallpaper"

[theme]
mode = "dark"
source = "custom"
custom_palette = "Mono"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "niri" ]

[bar.default]
position = "top"
thickness = 32
margin_ends = 0
margin_edge = 0
margin_opposite_edge = 0
radius = 0
concave_edge_corners = false
capsule = false
shadow = false
border_width = 0.0
padding = 8
widget_spacing = 10
font_weight = 600
start = [ "workspaces" ]
center = [ "clock" ]
end = [ "tray", "battery", "notifications", "session" ]

[widget.workspaces]
style = "regular"
show_labels = true
label_source = "id"
focused_color = "outline"
occupied_color = "surface_variant"
empty_color = "surface"

[widget.clock]
format = "{:%Y.%m.%d %a %H:%M}"
tooltip_format = "{:%Y년 %m월 %d일 %A}"

[widget.battery]
display_mode = "glyph"
show_label = true

[control_center]
hidden_tabs = [ "media", "system", "weather", "screen-time", "power" ]

[weather]
enabled = false
