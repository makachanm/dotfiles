[audio]
enable_sounds = false

[bar.default]
border_width = 0.0
capsule = false
center = [ "bar", "clock", "notifications" ]
concave_edge_corners = false
end = [ "tray", "bluetooth", "network", "volume", "brightness", "battery" ]
font_weight = 600
margin_edge = 0
margin_ends = 0
margin_opposite_edge = 0
padding = 8
position = "top"
radius = 0
shadow = false
start = [ "launcher", "workspaces" ]
thickness = 32
widget_spacing = 10

    [bar.default.dead_zone.actions]
    right = "none"

[battery]
warning_threshold = 5

[brightness]
sync_all_monitors = true

[calendar]

[control_center]
hidden_tabs = [ "media", "system", "weather", "screen-time", "power" ]
sidebar = "none"
sidebar_section = "none"

    [control_center.calendar]
    show_events_card = true

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 405.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1000.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 400.0

