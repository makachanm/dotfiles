[notification]
show_actions = false

[osd.kinds]
caffeine = false
dnd = false
keyboard_backlight = false
keyboard_layout = false
lock_keys = false
media = false
nightlight = false
privacy = false

[plugin_settings."ahmedhossamdev/sticky-notes"]
file_format = "txt"
panel_placement = "floating"
show_count = false

[plugins]
enabled = [ "prponkshe/mango-displays", "noctalia/bongocat", "ahmedhossamdev/sticky-notes" ]

[shell]
font_family = "IBM Plex Sans KR"
polkit_agent = true
setup_wizard_enabled = false

    [shell.animation]
    enabled = true
    speed = 1.5000000223517418

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    category_icons_only = false
    compact = true
    default_view = "pinned"
    layout = "full"
    pinned = [
        "zen-browser",
        "thorium-browser",
        "dev.diegovsky.Riff",
        "com.microsoft.VSCode",
        "org.gnome.gnome-commander",
        "slack",
        "vesktop",
        "com.ayugram.desktop",
        "steam",
        "org.prismlauncher.PrismLauncher",
        "com.obsproject.Studio",
        "gimp",
        "qalculate-gtk"
    ]
    show_app_origin_indicator = false
    show_session_button = false
    track_usage = false
    width = 800

        [shell.launcher.providers.calculator]
        global = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    directory = "/home/maka/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "lock"

    [[shell.session.actions]]
    action = "logout"

    [[shell.session.actions]]
    action = "suspend"

    [[shell.session.actions]]
    action = "reboot"

    [[shell.session.actions]]
    action = "shutdown"
    variant = "destructive"

[theme]
builtin = "Ayu"
custom_palette = "Mono"
mode = "dark"
shell_mode = "dark"
source = "custom"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "niri" ]

[wallpaper]
directory = "/home/maka/Pictures/wallpaper"
transition = []

    [wallpaper.default]
    path = "/home/maka/Pictures/wallpaper/vvvv.png"

    [wallpaper.last]
    path = "/home/maka/Pictures/wallpaper/vvvv.png"

    [wallpaper.monitors.DP-1]
    path = "/home/maka/Pictures/wallpaper/vvvv.png"

[weather]
enabled = false

[widget.bar]
type = "ahmedhossamdev/sticky-notes:bar"

[widget.battery]
anchor = true
display_mode = "graphic"
font_family = "IBM Plex Sans"
font_scale = 1.1000000000000001
font_weight = 300
scale = 0.90000000000000002
show_label = true

[widget.bluetooth]
show_label = false

[widget.brightness]
show_label = false
show_when_unavailable = true

[widget.clock]
format = "{:%Y.%m.%d %a %H:%M}"
tooltip_format = "{:%Y년 %m월 %d일 %A}"

[widget.launcher]
glyph = "menu-2"

[widget.network]
show_label = false

[widget.notifications]
scale = 1.0

[widget.session]
glyph = "shutdown"

[widget.usb]
hide_when_empty = true
type = "aristides/udiskie:status"

[widget.volume]
mute_color = "secondary"
show_label = false

[widget.workspaces]
active_pill_size = 1.0
empty_color = "surface"
focused_color = "outline"
font_weight = 600
label_source = "id"
occupied_color = "surface_variant"
scale = 1.25
show_labels = true
style = "regular"
