font_family Nordwand Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12
modify_font cell_height 3px
disable_ligatures always

window_padding_width 8 10
confirm_os_window_close 1
enable_audio_bell no
scrollback_lines 10000
copy_on_select clipboard
mouse_hide_wait -1
cursor_shape block
cursor_blink_interval 0.6
wayland_titlebar_color background
linux_display_server wayland
shell_integration no-cursor
update_check_interval 0

background #000000
foreground #e6e6e6
cursor #ffffff
cursor_text_color #000000
selection_background #444444
selection_foreground #ffffff
url_color #90b0d0

color0 #141414
color1 #c06060
color2 #80a080
color3 #b0a070
color4 #7090b0
color5 #a080a0
color6 #70a0a0
color7 #c4c4c4
color8 #666666
color9 #d08080
color10 #a0c0a0
color11 #d0c090
color12 #90b0d0
color13 #c0a0c0
color14 #90c0c0
color15 #ffffff
