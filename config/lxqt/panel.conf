[General]
panels=panel1

[panel1]
plugins=desktopswitch, spacer, worldclock, spacer2, cpu, statusnotifier, backlight, volume, battery
alignment=-1
animation-duration=0
desktop=0
hidable=false
hide-on-overlap=false
iconSize=20
lineCount=1
lockPanel=true
opacity=100
panelSize=33
position=Top
reserve-space=true
screen-name=DP-1
show-delay=0
visible-margin=true
width=100
width-percent=true

[desktopswitch]
type=desktopswitch
alignment=Left

[spacer]
type=spacer
alignment=Left
expandable=true
spaceType=invisible

[worldclock]
type=worldclock
alignment=Left
formatType=custom
customFormat="yyyy MM.dd ddd HH:mm"

[spacer2]
type=spacer
alignment=Left
expandable=true
spaceType=invisible

[cpu]
type=customcommand
alignment=Right
command=~/.local/bin/cpu-usage
runWithBash=true
repeat=true
repeatTimer=2
text=%1

[statusnotifier]
type=statusnotifier
alignment=Right

[backlight]
type=backlight
alignment=Right

[volume]
type=volume
alignment=Right
device=0

[battery]
type=customcommand
alignment=Right
command=~/.local/bin/battery-status
runWithBash=true
repeat=true
repeatTimer=30
text=%1
