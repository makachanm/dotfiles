[General]
panels=panel1

[panel1]
plugins=desktopswitch, spacer, worldclock, spacer2, cpuload, statusnotifier, backlight, volume, networkmonitor
alignment=-1
animation-duration=0
desktop=0
hidable=false
hide-on-overlap=false
iconSize=20
lineCount=1
lockPanel=true
opacity=100
panelSize=33
position=Top
reserve-space=true
screen-name=DP-1
show-delay=0
visible-margin=true
width=100
width-percent=true

[desktopswitch]
type=desktopswitch
alignment=Left

[spacer]
type=spacer
alignment=Left
expandable=true
spaceType=invisible

[worldclock]
type=worldclock
alignment=Left
formatType=custom
customFormat="yyyy MM.dd ddd HH:mm"

[spacer2]
type=spacer
alignment=Left
expandable=true
spaceType=invisible

[cpuload]
type=cpuload
alignment=Right
showText=true

[statusnotifier]
type=statusnotifier
alignment=Right

[backlight]
type=backlight
alignment=Right

[volume]
type=volume
alignment=Right
device=0

[networkmonitor]
type=networkmonitor
alignment=Right
