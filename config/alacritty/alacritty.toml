[window]
padding = { x = 10, y = 10 }
dynamic_padding = true

[font]
normal = { family = "Nordwand Mono" }
size = 13

[cursor]
style = { shape = "Block", blinking = "On" }

[colors.primary]
background = "#121212"
foreground = "#e6e6e6"
bright_foreground = "#ffffff"
dim_foreground = "#999999"

[colors.selection]
background = "#444444"
text = "#ffffff"

[colors.normal]
black = "#141414"
red = "#c06060"
green = "#80a080"
yellow = "#b0a070"
blue = "#7090b0"
magenta = "#a080a0"
cyan = "#70a0a0"
white = "#c4c4c4"

[colors.bright]
black = "#666666"
red = "#d08080"
green = "#a0c0a0"
yellow = "#d0c090"
blue = "#90b0d0"
magenta = "#c0a0c0"
cyan = "#90c0c0"
white = "#ffffff"
