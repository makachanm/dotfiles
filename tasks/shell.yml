- name: zsh as the login shell
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: /bin/zsh
  become: true

- name: zinit plugin manager
  ansible.builtin.git:
    repo: https://github.com/zdharma-continuum/zinit
    dest: "{{ user_home }}/.local/share/zinit/zinit.git"
    update: false

- name: zsh plugins (installed by zinit on first start)
  ansible.builtin.command: zsh -i -c exit
  args:
    creates: "{{ user_home }}/.local/share/zinit/plugins/zsh-users---zsh-autosuggestions"
  environment:
    TERM: dumb
