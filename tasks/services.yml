- name: keyd
  ansible.builtin.systemd_service:
    name: keyd
    enabled: true
    state: started
  become: true

- name: greetd
  ansible.builtin.systemd_service:
    name: greetd
    enabled: true
  become: true

- name: systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    enabled: true
  become: true
