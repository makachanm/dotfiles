- name: udev rules
  ansible.builtin.copy:
    src: "{{ repo }}/system/etc/udev/rules.d/"
    dest: /etc/udev/rules.d/
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload udev rules

- name: keyd config
  ansible.builtin.copy:
    src: "{{ repo }}/system/etc/keyd/default.conf"
    dest: /etc/keyd/default.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart keyd

- name: GRUB defaults
  ansible.builtin.copy:
    src: "{{ repo }}/system/etc/default/grub"
    dest: /etc/default/grub
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Rebuild grub config

- name: greetd config
  ansible.builtin.copy:
    src: "{{ repo }}/system/etc/greetd/config.toml"
    dest: /etc/greetd/config.toml
    owner: greetd
    group: greetd
    mode: "0644"
  become: true
