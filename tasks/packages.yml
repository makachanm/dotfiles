- name: dnf packages (packs/dnf.txt)
  ansible.builtin.dnf:
    name: "{{ dnf_packages }}"
    state: present
  become: true

- name: Vim as the system default editor
  ansible.builtin.dnf:
    name: vim-default-editor
    state: present
    allowerasing: true
  become: true

- name: cargo tools (packs/cargo.txt)
  community.general.cargo:
    name: "{{ cargo_crates }}"
    locked: true
  when: cargo_crates | length > 0
